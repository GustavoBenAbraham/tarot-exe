# Tema.grupo = aplicação | pergunta de reflexão. Grupos: 0 Maiores, 1 Paus, 2 Copas, 3 Espadas, 4 Ouros.
GENERAL.0=Relacione este símbolo aos valores e às mudanças que atravessam sua situação.|Qual escolha expressa melhor o que você deseja preservar?
GENERAL.1=Observe onde sua iniciativa encontra apoio e onde perde continuidade.|Que passo cabe na energia que você tem hoje?
GENERAL.2=Considere suas necessidades emocionais e a qualidade das trocas.|O que você precisa reconhecer ou comunicar com mais clareza?
GENERAL.3=Separe o que você sabe do que está supondo antes de decidir.|Qual informação ajudaria a revisar sua conclusão?
GENERAL.4=Traga a reflexão para os recursos e compromissos da rotina.|Que ajuste concreto tornaria seu dia mais sustentável?
RELATIONSHIPS.0=Observe os valores, limites e escolhas que sustentam o vínculo.|Que acordo precisa ser revisto sem presumir os sentimentos da outra pessoa?
RELATIONSHIPS.1=Considere como iniciativa, desejo e autonomia são compartilhados.|Quem costuma iniciar as conversas e como essa troca poderia ser mais equilibrada?
RELATIONSHIPS.2=Examine reciprocidade, cuidado e disponibilidade emocional.|Que necessidade pode ser expressa como um pedido claro, sem cobrança implícita?
RELATIONSHIPS.3=Observe a comunicação e as interpretações que alimentam o conflito.|O que foi realmente dito e o que você está deduzindo?
RELATIONSHIPS.4=Considere como tempo, responsabilidades e cuidados práticos são divididos.|Que combinação cotidiana ajudaria as pessoas envolvidas?
WORK.0=Relacione a carta ao sentido do trabalho, à responsabilidade e às mudanças de direção.|Qual decisão está alinhada aos seus valores e às condições reais do projeto?
WORK.1=Observe iniciativa, motivação e capacidade de dar continuidade à execução.|Qual entrega pequena permitiria testar a ideia antes de ampliá-la?
WORK.2=Considere escuta, cooperação e o clima das relações de trabalho.|Que conversa ajudaria a alinhar expectativas sem confundir cordialidade com concordância?
WORK.3=Examine critérios, informações e clareza dos acordos.|Que requisito ou decisão precisa ser escrito para evitar interpretações diferentes?
WORK.4=Considere planejamento, aprendizado e recursos disponíveis.|Que ajuste de prazo, escopo ou divisão de tarefas tornaria a entrega viável?
SELF_KNOWLEDGE.0=Observe o padrão de valores e escolhas que este símbolo ajuda você a investigar.|Que aspecto de si você deseja compreender sem se reduzir a um rótulo?
SELF_KNOWLEDGE.1=Investigue como entusiasmo e vontade se transformam em hábitos.|O que costuma fazer você começar e o que ajuda a continuar?
SELF_KNOWLEDGE.2=Observe suas emoções com curiosidade e respeite seus próprios limites.|Que sentimento você consegue nomear antes de reagir?
SELF_KNOWLEDGE.3=Examine pensamentos recorrentes e a diferença entre crítica útil e cobrança.|Que interpretação alternativa também seria compatível com os fatos?
SELF_KNOWLEDGE.4=Relacione suas prioridades ao tempo e ao cuidado que recebe na prática.|Que hábito pequeno aproximaria sua rotina dos seus valores?
